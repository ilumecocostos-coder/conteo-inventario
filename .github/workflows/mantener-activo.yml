name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 13 * * *'      # todos los días a las 8:00 a.m. hora de Colombia
  workflow_dispatch:           # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        run: |
          curl -fsS -X POST "https://fpyxwpoxwsloezrnxemz.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_ZwtcunjfJAlfkXk6Wkjjig_xV2PmxkT" \
            -H "Content-Type: application/json" \
            -d '{}'
